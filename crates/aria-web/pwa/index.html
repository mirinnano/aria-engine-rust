<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05080c">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./app.css">
    <title>Aria V3 Player</title>
  </head>
  <body>
    <main id="player" aria-label="Aria visual novel player">
      <canvas id="aria-canvas" tabindex="0" aria-label="Game canvas"></canvas>
      <p id="aria-status" role="status" aria-live="polite">起動中…</p>
      <button id="aria-update" type="button" hidden>更新して再起動</button>
    </main>
    <noscript>Aria Web Player requires JavaScript.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
