[package]
name = "aria-cli"
description = "Single command-line interface for Aria V3 projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aria"
path = "src/main.rs"

[features]
default = ["desktop-player"]
desktop-player = ["aria-native/desktop"]

[dependencies]
aes.workspace = true
anyhow.workspace = true
aria-core.workspace = true
aria-protection.workspace = true
aria-native.workspace = true
aria-web.workspace = true
atomic-write-file.workspace = true
blake3.workspace = true
cbc = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive"] }
flate2.workspace = true
fontdb.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
tempfile.workspace = true
