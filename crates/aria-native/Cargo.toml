[package]
name = "aria-native"
description = "Native platform adapter for Aria V3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
aria-core.workspace = true
aria-protection.workspace = true
aria-render.workspace = true
atomic-write-file.workspace = true
gilrs = { workspace = true, optional = true }
image = { workspace = true, optional = true }
kira = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true, default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles"] }
winit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
desktop = [
    "aria-render/native-gpu",
    "dep:kira",
    "dep:image",
    "dep:pollster",
    "dep:resvg",
    "dep:wgpu",
    "dep:winit",
    "dep:accesskit_winit",
    "dep:gilrs",
]
