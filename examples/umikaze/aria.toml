schema = 4

[game]
id = "jp.example.umikaze"
version = "3.2.0"
title = "海風 — The Records of Autumn"

[runtime]
entry = "scripts/main.aria"
logical_width = 1280
logical_height = 720
asset_roots = ["assets"]
# These remain as source/reference material, but the React presentation does
# not read them. Keep the shipping pak limited to the two role fonts instead
# of paying startup memory for unused decorative rasters and typefaces.
asset_excludes = [
  "assets/bg/title-seaside.png",
  "assets/fonts/ShipporiMincho-Regular.ttf",
  "assets/ui/chapter-ornament.png",
  "assets/ui/paper-grain.png",
  "assets/ui/sea-fog-overlay.png",
  "assets/ui/sea-mist-overlay.png",
  "assets/ui/wave-divider.png",
]
fonts = [
  "assets/fonts/NotoSansJP-Regular.ttf",
  "assets/fonts/MPLUS1Code-wght.ttf",
]
# Pack roles keep the reader face on the hot path. Record metadata, scene
# photographs, and other infrequently needed material stay in the cold pack so
# title startup does not map the full visual catalogue.
asset_pack_roles = {
  "assets/fonts/NotoSansJP-Regular.ttf" = "hot",
  "assets/fonts/MPLUS1Code-wght.ttf" = "cold",
  "assets/bg/scenes/blue-twilight-v1.webp" = "cold",
  "assets/bg/scenes/bridge-understructure-v1.webp" = "cold",
  "assets/bg/scenes/coast-road-dawn-v1.webp" = "cold",
  "assets/bg/scenes/ferry-fog-morning-v1.webp" = "cold",
  "assets/bg/scenes/ferry-night-deck-v1.webp" = "cold",
  "assets/bg/scenes/hospital-corridor-overcast-v1.webp" = "cold",
  "assets/bg/scenes/hotel-corridor-blue-v1.webp" = "cold",
  "assets/bg/scenes/mist-window-rail-v1.webp" = "cold",
  "assets/bg/scenes/mountain-room-dawn-v1.webp" = "cold",
  "assets/bg/scenes/neon-alley-v1.webp" = "cold",
  "assets/bg/scenes/night-window-motion-v1.webp" = "cold",
  "assets/bg/scenes/okayama-rail-window-v1.webp" = "cold",
  "assets/bg/scenes/passage-sunset-v1.webp" = "cold",
  "assets/bg/scenes/platform-sea-dawn-v1.webp" = "cold",
  "assets/bg/scenes/rail-platform-dawn-v1.webp" = "cold",
  "assets/bg/scenes/rail-window-sunset-v1.webp" = "cold",
  "assets/bg/scenes/rain-street-evening-v1.webp" = "cold",
  "assets/bg/scenes/rain-window-dusk-v1.webp" = "cold",
  "assets/bg/scenes/sannomiya-rain-platform-v1.webp" = "cold",
  "assets/bg/scenes/shore-storm-sunset-v1.webp" = "cold",
  "assets/bg/scenes/station-night-pass-v1.webp" = "cold",
  "assets/bg/scenes/terminus-grey-sea-v1.webp" = "cold",
  "assets/bg/scenes/train-motion-summer-v1.webp" = "cold",
  "assets/bg/scenes/train-rain-grey-v1.webp" = "cold",
  "assets/bg/scenes/train-window-summer-v1.webp" = "cold",
  "assets/bg/scenes/understructure-evening-v1.webp" = "cold",
}
# This manuscript revision intentionally invalidates earlier routes and
# checkpoints. Only this exact predecessor is purged; other Aria games and
# namespaces are never touched.
save_namespace = "umikaze-v4"
legacy_save_namespaces = ["umikaze-v3"]

[presentation]
frontend = "ui"
