schema = 4

[game]
id = "jp.example.aria-v3-player-smoke"
version = "1.0.0"
title = "Aria V3 Native Player Smoke"

[runtime]
entry = "scripts/main.aria"
logical_width = 640
logical_height = 360
asset_roots = ["assets"]
fonts = ["assets/fonts/NotoSansJP-Regular.ttf"]
save_namespace = "aria-v3-player-smoke"

[presentation]
# A release project always names its owned presentation, even when this smoke
# project is primarily exercised through the native player.  This keeps the
# manifest valid for every release target and catches schema drift early.
frontend = "ui"
