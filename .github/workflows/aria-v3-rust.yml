name: Aria V3 Rust

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "vendor/**"
      - "deny.toml"
      - "crates/**"
      - "compatibility/v3/**"
      - "examples/v3-minimal/**"
      - "examples/v3-player-smoke/**"
      - "examples/umikaze/**"
      - "scripts/build-v3-web.*"
      - "scripts/classify-v3-legacy-tests.py"
      - "scripts/v3-web-smoke.mjs"
      - "scripts/v3-web-save-smoke.mjs"
      - ".github/workflows/aria-v3-rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "vendor/**"
      - "deny.toml"
      - "crates/**"
      - "compatibility/v3/**"
      - "examples/v3-minimal/**"
      - "examples/v3-player-smoke/**"
      - "examples/umikaze/**"
      - "scripts/build-v3-web.*"
      - "scripts/classify-v3-legacy-tests.py"
      - "scripts/v3-web-smoke.mjs"
      - "scripts/v3-web-save-smoke.mjs"
      - ".github/workflows/aria-v3-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Non-secret fixture key for CI's signed-package smoke tests. Production
  # release jobs must inject their real publisher key through a secret.
  ARIA_PAK_SIGNING_KEY: publisher:0707070707070707070707070707070707070707070707070707070707070707

jobs:
  quality:
    name: Core, formats, and deterministic replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libudev-dev pkg-config libwayland-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install matching wasm-bindgen CLI for web-build coverage
        # The CLI's web-build coverage intentionally exercises the automatic
        # wasm runtime build, which requires the matching host-side bindgen
        # binary. Keep this explicit rather than allowing a developer's PATH
        # to decide whether the release test is meaningful.
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Test workspace and architecture boundary
        run: cargo test --workspace --locked
      - name: Check legacy-test classification is current
        run: python3 scripts/classify-v3-legacy-tests.py --check
      - name: Check release-compatible example project
        run: cargo run --locked -p aria-cli -- check examples/v3-minimal --release
      - name: Check native-player release smoke project
        run: cargo run --locked -p aria-cli -- check examples/v3-player-smoke --release
      - name: Check V3.2 umikaze UI sample
        run: cargo run --locked -p aria-cli -- check examples/umikaze --release

  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libudev-dev pkg-config libwayland-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - name: Compile Winit/wgpu/Kira/AccessKit adapter
        run: cargo check -p aria-native --features desktop --locked
      - name: Test native adapter
        run: cargo test -p aria-native --features desktop --locked --lib
      - name: Build matching host package
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) target="windows-x64" ;;
            macOS) target="macos-universal" ;;
            Linux) target="linux-x64" ;;
          esac
          if [ "${{ runner.os }}" = "macOS" ]; then
            # A universal Mach-O must be assembled from both Apple slices; the
            # macOS matrix job only proves the portable data artifact here.
            cargo run --locked -p aria-cli -- build examples/v3-minimal --target "$target" --out "target/package-$target"
          else
            cargo run --locked --release -p aria-cli -- build examples/v3-minimal --target "$target" --profile signed --release --out "target/package-$target"
          fi
          test -f "target/package-$target/game.ariac"
          test -f "target/package-$target/game.ariapak"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test ! -f "target/package-$target/aria-player"
          else
            if [ "${{ runner.os }}" = "Windows" ]; then player="aria-player.exe"; else player="aria-player"; fi
            test -f "target/package-$target/$player"
            (cd "target/package-$target" && "./$player" --headless > first-frame.json)
            grep -q '"frame_number"' "target/package-$target/first-frame.json"
          fi
      - name: Launch a packaged Native Player under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked --release -p aria-cli -- build examples/v3-player-smoke --target linux-x64 --profile signed --release --out target/native-player-smoke
          python3 scripts/assert-process-stays-alive.py --seconds 4 --minimum-seconds 2 -- \
            xvfb-run -a target/native-player-smoke/aria-player
      - name: Assert native player size budget
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then player="aria-player.exe"; else player="aria-player"; fi
          size=$(stat -c%s target/package-*/$player 2>/dev/null || stat -f%z target/package-*/$player)
          echo "player size: $size bytes"
          # 25 MiB budget (current ~19.3MB); Phase E may tighten this further.
          test "$size" -le 26214400
      - name: Upload native release package
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: aria-native-${{ matrix.os }}
          path: target/package-*/**

  linux-appimage:
    name: Linux distro-neutral AppImage shell
    # This is the oldest Tauri/WebKit baseline we support, not an Ubuntu-only
    # release. The resulting AppImage is the Linux download for every
    # supported distribution family.
    runs-on: ubuntu-22.04
    env:
      ARIA_PAK_PROFILE: signed
      ARIA_PAK_VERIFICATION_KEY_ID: publisher
      ARIA_PAK_VERIFICATION_KEY_HEX: ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c
      ARIA_TAURI_BUNDLES: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/umikaze/ui/package-lock.json
      - name: Install the portable Linux shell baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev libudev-dev pkg-config libwayland-dev
      - name: Install build tools and frontend dependencies
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm ci --prefix examples/umikaze/ui
      - name: Stage content through the Aria CLI and wrap it as AppImage
        run: npm --prefix examples/umikaze/ui run release:desktop
      - name: Assert the distro-neutral artifact
        shell: bash
        run: |
          appimage=$(find examples/umikaze/ui/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          test -x "$appimage"
          file "$appimage"

  wasm-chromium:
    name: WASM Chromium offline shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check the full workspace for wasm portability
        # `aria-cli` enables its native desktop player by default. That is a
        # host-only feature (and pulls ALSA on Linux), so turn it off while
        # checking the portable Web/WASM surface.
        run: cargo check --workspace --target wasm32-unknown-unknown --no-default-features --locked
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build runnable PWA
        run: ./scripts/build-v3-web.sh examples/v3-minimal target/v3-web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Exercise WASM runtime in Chromium
        run: |
          python3 -m http.server 4173 --directory target/v3-web >/tmp/aria-v3-http.log 2>&1 &
          ARIA_WEB_TEST_VERIFICATION_KEY=ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c \
            node scripts/v3-web-smoke.mjs http://127.0.0.1:4173/
          ARIA_WEB_TEST_VERIFICATION_KEY=ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c \
            node scripts/v3-web-save-smoke.mjs http://127.0.0.1:4173/
      - name: Build umikaze web package
        run: |
          npm --prefix examples/umikaze/ui ci
          cargo run --locked --release -p aria-cli --no-default-features -- build examples/umikaze --target web --profile signed --release --out target/umikaze-web
      - name: Assert web artifact size budgets
        run: |
          wasm_bytes=$(stat -c%s target/umikaze-web/pkg/aria_web_bg.wasm)
          echo "wasm runtime: $wasm_bytes bytes"
          # 2.5 MiB budget (current ~1.8MB); Phase E tightens this to 2.0MB.
          test "$wasm_bytes" -le 2621440
          total_bytes=$(du -sb target/umikaze-web | cut -f1)
          echo "umikaze web package: $total_bytes bytes"
          # Interim 31MB budget; Phase E tightens this to 20MB.
          test "$total_bytes" -le 32505856
      - name: Upload PWA
        uses: actions/upload-artifact@v4
        with:
          name: aria-v3-web
          path: target/v3-web/**

  macos-universal:
    name: macOS universal Native Player
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Build both Apple slices
        run: |
          cargo build --locked --release -p aria-cli --features desktop-player --target aarch64-apple-darwin
          cargo build --locked --release -p aria-cli --features desktop-player --target x86_64-apple-darwin
          mkdir -p target/macos-universal
          lipo -create \
            target/aarch64-apple-darwin/release/aria \
            target/x86_64-apple-darwin/release/aria \
            -output target/macos-universal/aria-player
          file target/macos-universal/aria-player
      - name: Verify FAT Mach-O header
        run: |
          python3 - <<'EOF'
          import struct
          with open("target/macos-universal/aria-player", "rb") as handle:
              magic = struct.unpack(">I", handle.read(4))[0]
          assert magic in (0xCAFEBABE, 0xCAFEBABF), hex(magic)
          print("FAT Mach-O verified:", hex(magic))
          EOF
      - name: Build and launch universal package
        run: |
          ARIA_PLAYER_BINARY="$PWD/target/macos-universal/aria-player" \
            cargo run --locked --release -p aria-cli -- build \
            examples/v3-player-smoke --target macos-universal --profile signed --release \
            --out target/package-macos-universal
          file target/package-macos-universal/aria-player
          python3 scripts/assert-process-stays-alive.py --seconds 4 --minimum-seconds 2 -- \
            target/package-macos-universal/aria-player
      - uses: actions/upload-artifact@v4
        with:
          name: aria-native-macos-universal
          path: target/package-macos-universal/**

  supply-chain:
    name: Audit dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # `rustsec/audit-check@v2` installs the newest cargo-audit without its
      # lockfile. Pin the Rust-1.89-compatible CVSS 4-aware release and its
      # reviewed dependency graph. The workspace uses thin LTO for shipped
      # binaries; audit is a disposable CI utility, so disable it here to
      # avoid tool-install linker failures on runner LLVM versions.
      - name: Audit security advisories
        run: |
          CARGO_PROFILE_RELEASE_LTO=off cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
