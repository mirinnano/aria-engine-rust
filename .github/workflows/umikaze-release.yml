name: HesPhoros builds

# The repository is public, so the full game never becomes a workflow artifact
# or a GitHub Release asset: each desktop job uploads its own installer to the
# private R2 bucket behind ponkotsu-soft's download page: the full game needs
# an access code, the free DAY 0–4 demo does not, and both are rate-limited.
on:
  push:
    branches: [main]
    tags: ["umikaze-v*"]
    paths:
      - "crates/**"
      - "ui/**"
      - "examples/umikaze/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/r2-publish.mjs"
      - ".github/workflows/umikaze-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hesphoros-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Private distribution (Cloudflare R2, S3 API). Without these secrets the
  # builds and tests still run and nothing is uploaded.
  R2_BUCKET: ${{ vars.R2_BUCKET || 'ponkotsu-downloads' }}
  R2_PREFIX: hesphoros
  AWS_DEFAULT_REGION: auto

jobs:
  web:
    name: Web release verification
    runs-on: ubuntu-latest
    env:
      ARIA_PAK_PROFILE: signed
      ARIA_PAK_SIGNING_KEY: ${{ secrets.ARIA_PAK_SIGNING_KEY }}
      ARIA_PAK_VERIFICATION_KEY_ID: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_ID }}
      ARIA_PAK_VERIFICATION_KEY_HEX: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: umikaze-web-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/umikaze/ui/package-lock.json
      - name: Restore wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.126-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install frontend and browser dependencies
        run: |
          npm ci --prefix examples/umikaze/ui
          npx --prefix examples/umikaze/ui playwright install --with-deps chromium
      - name: Verify Core and canonical scenario
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p aria-core
          cargo test --locked -p aria-cli --no-default-features --test umikaze_sample
      - name: Verify full presentation bundle in Chromium
        run: |
          npm --prefix examples/umikaze/ui run prepare:desktop
          python3 -m http.server 4173 --bind 127.0.0.1 --directory examples/umikaze/dist/build/full/web >/tmp/umikaze-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npm --prefix examples/umikaze/ui test
      - name: Verify demo presentation bundle in Chromium
        run: |
          npm --prefix examples/umikaze/ui run prepare:demo
          python3 -m http.server 4173 --bind 127.0.0.1 --directory examples/umikaze/dist/build/demo/web >/tmp/umikaze-demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          UMIKAZE_DEMO=true npm --prefix examples/umikaze/ui test -- --grep 'opening arc|animation-frame loop|offline PWA'
      - name: Build static Web releases
        run: |
          npm --prefix examples/umikaze/ui run release:web
          npm --prefix examples/umikaze/ui run release:demo:web
      # The Web builds are verified here but not distributed from this job:
      # the demo is published by aria-web-pages.yml, the full game only as
      # desktop installers on R2.

  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux distribution is the universal AppImage candidate. Debian
          # packaging remains available locally, but is not the release gate.
          - os: ubuntu-22.04
            bundles: appimage
            artifact: linux-universal
            platform: linux
          - os: macos-latest
            bundles: dmg
            artifact: macos
            platform: macos
          - os: windows-latest
            bundles: nsis
            artifact: windows
            platform: windows
    env:
      ARIA_PAK_PROFILE: signed
      ARIA_PAK_SIGNING_KEY: ${{ secrets.ARIA_PAK_SIGNING_KEY }}
      ARIA_PAK_VERIFICATION_KEY_ID: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_ID }}
      ARIA_PAK_VERIFICATION_KEY_HEX: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_HEX }}
      ARIA_TAURI_BUNDLES: ${{ matrix.bundles }}
      # Job-level so the upload step's `if` can see whether R2 is configured.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: umikaze-desktop-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/umikaze/ui/package-lock.json
      - name: Install Linux WebKit/native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev libudev-dev pkg-config libwayland-dev
      - name: Install frontend dependencies
        run: npm ci --prefix examples/umikaze/ui
      - name: Verify desktop save adapter
        shell: bash
        run: |
          # tauri::generate_context! requires frontendDist to exist at compile
          # time; the real bundles are built in the release steps below.
          mkdir -p examples/umikaze/dist/build/full/web examples/umikaze/dist/build/demo/web
          cargo test --locked --manifest-path examples/umikaze/ui/src-tauri/Cargo.toml
      - name: Build full native installer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/umikaze-full
        run: npm --prefix examples/umikaze/ui run release:desktop
      - name: Build demo native installer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/umikaze-demo
        run: npm --prefix examples/umikaze/ui run release:demo:desktop
      - name: Verify native installer manifests
        shell: bash
        run: |
          test -s target/umikaze-full/release/bundle/release-manifest.json
          test -s target/umikaze-full/release/bundle/checksums.sha256
          test -s target/umikaze-demo/release/bundle/release-manifest.json
          test -s target/umikaze-demo/release/bundle/checksums.sha256
      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="main-${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Upload installers to private R2
        if: env.R2_ACCESS_KEY_ID != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Both editions live in the same private bucket; the site serves the
          # demo without a code and the full game with one, rate-limited per IP.
          for edition in full demo; do
            prefix="$R2_PREFIX"; [ "$edition" = demo ] && prefix="$R2_PREFIX-demo"
            mkdir -p "fragments/$edition"
            fragment="fragments/$edition/${{ matrix.platform }}.json"
            node scripts/r2-publish.mjs fragment "target/umikaze-$edition/release/bundle" \
              "${{ matrix.platform }}" "$prefix/builds/$VERSION" "$fragment"
            local_file=$(node -p "require('./$fragment').local")
            key=$(node -p "require('./$fragment').key")
            aws s3 cp "$local_file" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
      # A fragment names the R2 key, size, and SHA-256 only; it holds no game data.
      - uses: actions/upload-artifact@v4
        if: hashFiles('fragments/**/*.json') != ''
        with:
          name: hesphoros-fragments-${{ matrix.platform }}
          path: fragments/
          retention-days: 3

  publish:
    name: Publish manifests to R2
    needs: [web, desktop]
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        if: env.R2_ACCESS_KEY_ID != ''
      - uses: actions/download-artifact@v4
        if: env.R2_ACCESS_KEY_ID != ''
        with:
          pattern: hesphoros-fragments-*
          path: fragments
          merge-multiple: true
      - name: Write latest.json and prune old builds
        if: env.R2_ACCESS_KEY_ID != ''
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="main-${GITHUB_SHA::7}"; fi
          for edition in full demo; do
            prefix="$R2_PREFIX"; [ "$edition" = demo ] && prefix="$R2_PREFIX-demo"
            node scripts/r2-publish.mjs manifest "fragments/$edition" "$version" "$GITHUB_SHA" "$edition.json"
            aws s3 cp "$edition.json" "s3://$R2_BUCKET/$prefix/builds/$version/manifest.json" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
            aws s3 cp "$edition.json" "s3://$R2_BUCKET/$prefix/latest.json" --endpoint-url "$R2_ENDPOINT" \
              --only-show-errors --content-type application/json --cache-control no-store
            # Keep the five newest main builds to bound storage; tagged builds stay.
            # A bucket lifecycle rule also expires main builds after 180 days.
            aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$prefix/builds/main-" \
              --endpoint-url "$R2_ENDPOINT" --output text \
              --query "Contents[?ends_with(Key, 'manifest.json')].[LastModified,Key]" \
              | grep -v '^None$' | sort | head -n -5 | awk '{print $2}' | while read -r manifest; do
                old="${manifest%/manifest.json}"
                echo "pruning $old"
                aws s3 rm "s3://$R2_BUCKET/$old" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
              done
          done
      - name: R2 not configured
        if: env.R2_ACCESS_KEY_ID == ''
        run: echo "::notice::R2 secrets are not set; the builds were tested but not distributed."
