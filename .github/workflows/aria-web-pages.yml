name: Deploy Umikaze demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/aria-cli/**
      - crates/aria-core/**
      - crates/aria-protection/**
      - crates/aria-render/**
      - crates/aria-web/**
      - ui/packages/aria-ui-sdk/**
      - examples/umikaze/**
      - .github/workflows/aria-web-pages.yml
  workflow_dispatch:

concurrency:
  group: umikaze-demo-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build signed demo site
    runs-on: ubuntu-latest
    env:
      ARIA_PAK_PROFILE: signed
      ARIA_PAK_SIGNING_KEY: ${{ secrets.ARIA_PAK_SIGNING_KEY }}
      ARIA_PAK_VERIFICATION_KEY_ID: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_ID }}
      ARIA_PAK_VERIFICATION_KEY_HEX: ${{ secrets.ARIA_PAK_VERIFICATION_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/umikaze/ui/package-lock.json
      - name: Install build and browser dependencies
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm ci --prefix examples/umikaze/ui
          npx --prefix examples/umikaze/ui playwright install --with-deps chromium
      - name: Build and verify the content-limited demo
        run: |
          npm --prefix examples/umikaze/ui run prepare:demo
          # Exercise the same project-subdirectory semantics as
          # https://<owner>.github.io/<repository>/ rather than only a local
          # origin root.  The presentation deliberately emits relative URLs.
          python3 -m http.server 4173 --bind 127.0.0.1 --directory examples/umikaze/dist >/tmp/umikaze-pages-http.log 2>&1 &
          ARIA_UI_URL=http://127.0.0.1:4173/web/ UMIKAZE_DEMO=true npm --prefix examples/umikaze/ui test -- --grep 'opening arc|animation-frame loop'
          cargo test -p aria-cli --no-default-features --test umikaze_sample demo_variant_compiles_only_the_opening_arc_and_closes_after_day_four
      - name: Produce the signed static release
        run: |
          npm --prefix examples/umikaze/ui run release:demo:web
          touch dist/releases/demo-web/site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/releases/demo-web/site

  deploy:
    name: Deploy demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
